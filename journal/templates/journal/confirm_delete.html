{% extends 'journal/base.html' %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post" class="card-form">
    {% csrf_token %}
    <p>Подтвердите удаление: <strong>{{ object }}</strong></p>
    <div class="actions"><button class="danger" type="submit">Удалить</button><a class="button" href="javascript:history.back()">Отмена</a></div>
</form>
{% endblock %}
