{% extends 'journal/base.html' %}
{% block content %}
<div class="page-head"><h1>Учебные предметы</h1><a class="button primary" href="{% url 'subject_create' %}">Добавить предмет</a></div>
<table>
<thead><tr><th>Название</th><th>Действия</th></tr></thead>
<tbody>
{% for s in subjects %}<tr><td>{{ s.name }}</td><td><a href="{% url 'subject_edit' s.id %}">Изменить</a> · <a href="{% url 'subject_delete' s.id %}">Удалить</a></td></tr>
{% empty %}<tr><td colspan="2">Предметы не найдены.</td></tr>{% endfor %}
</tbody>
</table>
{% endblock %}
