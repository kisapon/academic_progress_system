{% extends 'journal/base.html' %}
{% block content %}
<div class="page-head"><h1>Назначения преподавателей</h1><a class="button primary" href="{% url 'assignment_create' %}">Создать назначение</a></div>
<table>
<thead><tr><th>Преподаватель</th><th>Группа</th><th>Предмет</th><th>Действия</th></tr></thead>
<tbody>
{% for a in assignments %}<tr><td>{{ a.teacher }}</td><td>{{ a.group }}</td><td>{{ a.subject }}</td><td><a href="{% url 'assignment_delete' a.id %}">Удалить</a></td></tr>
{% empty %}<tr><td colspan="4">Назначения не найдены.</td></tr>{% endfor %}
</tbody>
</table>
{% endblock %}
